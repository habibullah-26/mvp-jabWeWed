<div class="budget-wrapper">
  <h2 class="budget-title">Budget Tracker</h2>
  <table class="budget-table">
    <thead>
      <tr>
        <th>Category</th>
        <th>Estimated</th>
        <th>Actual</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>{{ item.category }}</td>
        <td>{{ item.estimated | currency:'USD' }}</td>
        <td>{{ item.actual | currency:'USD' }}</td>
      </tr>
    </tbody>
    <tfoot>
      <tr class="totals-row">
        <td><strong>Totals</strong></td>
        <td><strong>{{ totalEstimated | currency:'USD' }}</strong></td>
        <td><strong>{{ totalActual | currency:'USD' }}</strong></td>
      </tr>
    </tfoot>
  </table>
</div>
