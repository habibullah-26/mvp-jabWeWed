<div class="profile-wrapper">
  <div class="profile-card">
    <h2 class="profile-title">Profile</h2>
    <form [formGroup]="vendorForm" (ngSubmit)="onSubmit()" class="profile-form">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Venue Name</label>
          <input id="name" formControlName="name" type="text" class="form-control" placeholder="Venue Name" />
          <div *ngIf="vendorForm.get('name')?.invalid && vendorForm.get('name')?.touched" class="error">Name is required.</div>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" formControlName="category" class="form-control">
            <option value="" disabled selected>Select Category</option>
            <option value="Banquet">Banquet</option>
            <option value="Outdoor">Outdoor</option>
            <option value="Hotel">Hotel</option>
            <option value="Farmhouse">Farmhouse</option>
            <!-- Add more categories as needed -->
          </select>
          <div *ngIf="vendorForm.get('category')?.invalid && vendorForm.get('category')?.touched" class="error">Category is required.</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="city">City</label>
          <input id="city" formControlName="city" type="text" class="form-control" placeholder="City" />
          <div *ngIf="vendorForm.get('city')?.invalid && vendorForm.get('city')?.touched" class="error">City is required.</div>
        </div>
        <div class="form-group">
          <label for="priceRange">Price Range</label>
          <input id="priceRange" formControlName="priceRange" type="text" class="form-control" placeholder="e.g. 350k - 600k" />
          <div *ngIf="vendorForm.get('priceRange')?.invalid && vendorForm.get('priceRange')?.touched" class="error">Price range is required.</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="rating">Rating</label>
          <input id="rating" formControlName="rating" type="number" step="0.1" min="0" max="5" class="form-control" placeholder="0-5" />
          <div *ngIf="vendorForm.get('rating')?.invalid && vendorForm.get('rating')?.touched" class="error">Rating must be between 0 and 5.</div>
        </div>
        <div class="form-group"></div>
      </div>
      <div class="form-group full-width">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" class="form-control" placeholder="Description"></textarea>
        <div *ngIf="vendorForm.get('description')?.invalid && vendorForm.get('description')?.touched" class="error">Description is required.</div>
      </div>
      <div class="form-actions">
        <button type="submit" class="submit-btn" [disabled]="vendorForm.invalid">Create Profile</button>
      </div>
    </form>
  </div>
</div>
