<div class="slider">
    <div class="image-container">
        <img *ngIf="images && images.length > 0 && images[index]" 
             [src]="images[index]" 
             [alt]="'Slide ' + (index + 1)">
        <div class="dots">
            <span 
                *ngFor="let img of images || []; let i = index" 
                class="dot" 
                [class.active]="i === index"
                (click)="goToSlide(i)">
            </span>
        </div>
    </div>
</div>
