
<div class="registry-filter-bar right-align">
  <form [formGroup]="registryFilterForm" class="registry-filter-form" (ngSubmit)="search()">
    <input formControlName="firstName" placeholder="First Name">
    <input formControlName="lastName" placeholder="Last Name">
    <select formControlName="month">
      <option value="">Month</option>
      <option *ngFor="let m of months" [value]="m.value">{{m.name}}</option>
    </select>
    <select formControlName="year">
      <option value="">Year</option>
      <option *ngFor="let y of years" [value]="y">{{y}}</option>
    </select>
    <button type="submit">Search</button>
  </form>
</div>


<div class="registry-table-card">
  <table class="response-table">
    <thead>
      <tr>
        <th>Registrant</th>
        <th>Co-Registrant</th>
        <th>Wedding Date</th>
        <th>Wedding Location</th>
        <th>Wedding Website</th>
        <th>Registry</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of registries">
        <td>{{r.firstName}} {{r.lastName}}</td>
        <td>{{r.coRegistrant}}</td>
        <td>{{r.weddingDate}}</td>
        <td>{{r.weddingLocation}}</td>
        <td><a [href]="r.weddingWebsite" target="_blank">Visit</a></td>
        <td><a [href]="r.registryLink" target="_blank">View Registry</a></td>
      </tr>
    </tbody>
  </table>
</div>
